const CURRICULUM = [
  ...MODULES.find(m => m.id === "personal").lessons.map(l => ({ ...l, modId: "personal" })),
  ...MODULES.find(m => m.id === "tax").lessons.map(l => ({ ...l, modId: "tax" })),
  ...MODULES.find(m => m.id === "stocks").lessons.map(l => ({ ...l, modId: "stocks" })),
  ...MODULES.find(m => m.id === "realestate").lessons.map(l => ({ ...l, modId: "realestate" }))
];

const BADGES = [
  { id: "first_step", label: "첫걸음", check: s => s.completed.size >= 1 },
  { id: "week1", label: "1주 완주", check: s => s.completed.size >= 7 },
  { id: "personal_master", label: "재무 마스터", check: s => moduleProgress("personal", s) === 1 },
  { id: "tax_master", label: "절세 마스터", check: s => moduleProgress("tax", s) === 1 },
  { id: "stock_master", label: "투자 마스터", check: s => moduleProgress("stocks", s) === 1 },
  { id: "real_master", label: "부동산 마스터", check: s => moduleProgress("realestate", s) === 1 },
  { id: "all_master", label: "🏆 자산증식 졸업", check: s => totalLessons() === s.completed.size }
];

const memStore = {};
const storage = {
  get(k, def) { try { const v = localStorage.getItem("mb_" + k); return v === null ? def : JSON.parse(v); } catch { return memStore[k] === undefined ? def : memStore[k]; } },
  set(k, v) { try { localStorage.setItem("mb_" + k, JSON.stringify(v)); } catch { memStore[k] = v; } }
};

const todayStr = () => new Date().toISOString().slice(0, 10);
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / (1000 * 60 * 60 * 24));

const state = {
  tab: "home",
  view: { type: "home" },
  completed: new Set(storage.get("completed", [])),
  startDate: storage.get("startDate", null),
  pace: storage.get("pace", 1)
};

function saveState() {
  storage.set("completed", Array.from(state.completed));
  storage.set("startDate", state.startDate);
  storage.set("pace", state.pace);
}

function ensureStartDate() {
  if (!state.startDate) { state.startDate = todayStr(); saveState(); }
}

function totalLessons() { return CURRICULUM.length; }
function totalDays() { return Math.ceil(totalLessons() / state.pace); }
function currentDayNumber() {
  ensureStartDate();
  const d = daysBetween(state.startDate, todayStr()) + 1;
  return Math.max(1, Math.min(d, totalDays()));
}
function lessonsForDay(day) {
  const start = (day - 1) * state.pace;
  return CURRICULUM.slice(start, start + state.pace);
}
function todaysLessons() { return lessonsForDay(currentDayNumber()); }
function todayDoneCount() { return todaysLessons().filter(l => state.completed.has(l.id)).length; }
function isTodayComplete() { const t = todaysLessons(); return t.length > 0 && t.every(l => state.completed.has(l.id)); }
function isCourseComplete() { return state.completed.size === totalLessons(); }
function lessonDayNumber(lessonId) {
  const idx = CURRICULUM.findIndex(l => l.id === lessonId);
  if (idx < 0) return null;
  return Math.floor(idx / state.pace) + 1;
}
function moduleProgress(modId, s = state) {
  const m = MODULES.find(x => x.id === modId);
  if (!m) return 0;
  const done = m.lessons.filter(l => s.completed.has(l.id)).length;
  return done / m.lessons.length;
}
function unlockedBadges() { return BADGES.filter(b => b.check(state)); }
function levelInfo() {
  const ratio = state.completed.size / totalLessons();
  if (ratio >= 1) return { lv: 5, name: "Lv.5 자산증식 마스터", short: "🏆 마스터" };
  if (ratio >= 0.7) return { lv: 4, name: "Lv.4 실전형", short: "고수 Lv.4" };
  if (ratio >= 0.4) return { lv: 3, name: "Lv.3 중급", short: "중급 Lv.3" };
  if (ratio >= 0.15) return { lv: 2, name: "Lv.2 입문 졸업", short: "입문 Lv.2" };
  return { lv: 1, name: "Lv.1 입문", short: "초보 Lv.1" };
}

const view = document.getElementById("view");
const tabs = document.getElementById("tabs");

tabs.addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  state.tab = b.dataset.tab;
  state.view = { type: state.tab === "home" ? "home" : state.tab };
  render();
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if (confirm("진행상황과 시작일을 모두 초기화할까요?")) {
    state.completed.clear();
    state.startDate = null;
    state.pace = 1;
    saveState();
    render();
  }
});

function renderTodayCard() {
  ensureStartDate();
  const day = currentDayNumber();
  const total = totalDays();
  const lessons = todaysLessons();
  const done = isTodayComplete();
  const courseDone = isCourseComplete();
  const card = document.createElement("div");
  card.className = "today-card" + (courseDone ? " completed" : (done ? " done" : ""));
  if (courseDone) {
    card.innerHTML = `<div class="row1"><span class="label">🎓 코스 완주</span><span class="day-pill">Day ${total} / ${total}</span></div><h2>모든 레슨을 마쳤어요!</h2><div class="sub">이제 '도구' 탭에서 시뮬레이션을 돌려보거나, 마음 가는 레슨을 다시 복습해보세요.</div>`;
    return card;
  }
  const itemsHtml = lessons.map(l => {
    const isDone = state.completed.has(l.id);
    return `<div class="today-item ${isDone ? "done" : ""}" data-lesson="${l.id}" data-mod="${l.modId}"><div class="check">${isDone ? "✓" : ""}</div><span>${l.title}</span></div>`;
  }).join("");
  if (done) {
    card.innerHTML = `<div class="row1"><span class="label">🎉 오늘 학습 완료</span><span class="day-pill">Day ${day} / ${total}</span></div><h2>잘했어요! 내일 또 만나요</h2><div class="sub">하루에 ${state.pace}강씩, 지금 페이스라면 ${total - day}일 후 코스 완주!</div><div class="today-list">${itemsHtml}</div>`;
  } else {
    card.innerHTML = `<div class="row1"><span class="label">🌅 오늘의 학습</span><span class="day-pill">Day ${day} / ${total}</span></div><h2>${todayDoneCount()}/${lessons.length} 강 완료</h2><div class="sub">오늘 ${state.pace}강만 끝내면 충분해요. 짧고 굵게!</div><div class="today-list">${itemsHtml}</div><button class="today-cta" id="todayStart">${todayDoneCount() > 0 ? "이어서 학습하기" : "오늘 학습 시작"} →</button>`;
  }
  card.querySelectorAll(".today-item").forEach(el => {
    el.addEventListener("click", () => {
      state.tab = "learn";
      state.view = { type: "lesson", modId: el.dataset.mod, lessonId: el.dataset.lesson };
      render();
    });
  });
  const cta = card.querySelector("#todayStart");
  if (cta) {
    cta.addEventListener("click", () => {
      const next = lessons.find(l => !state.completed.has(l.id)) || lessons[0];
      state.tab = "learn";
      state.view = { type: "lesson", modId: next.modId, lessonId: next.id };
      render();
    });
  }
  return card;
}

function renderPaceStrip() {
  const day = currentDayNumber();
  const total = totalDays();
  const remainingDays = isTodayComplete() ? total - day : (total - day + 1);
  const strip = document.createElement("div");
  strip.className = "pace-strip";
  strip.innerHTML = `<div class="info">📅 <b>하루 ${state.pace}강</b> · 총 <b>${total}일 코스</b> · 남은 일수 <b>${Math.max(0, remainingDays)}일</b></div><div class="pace-segs" id="paceSegs"><button data-pace="1" class="${state.pace===1?"active":""}">1강/일</button><button data-pace="2" class="${state.pace===2?"active":""}">2강/일</button><button data-pace="3" class="${state.pace===3?"active":""}">3강/일</button></div>`;
  strip.querySelectorAll("[data-pace]").forEach(b => {
    b.addEventListener("click", () => {
      state.pace = parseInt(b.dataset.pace);
      saveState();
      render();
    });
  });
  return strip;
}

function renderProgressCard() {
  const card = document.createElement("section");
  card.className = "progress-card";
  const total = totalLessons();
  const done = state.completed.size;
  const pct = Math.round(done / total * 100);
  const lv = levelInfo();
  const badges = unlockedBadges();
  card.innerHTML = `<div class="row"><div><h2>전체 진행률</h2><div class="muted">${done === total ? "🎉 모든 레슨 완료!" : `${total - done}개 레슨 남았어요`}</div></div><div class="pct">${pct}%</div></div><div class="bar"><span style="width:${pct}%"></span></div><div class="stats-row"><div class="stat"><div class="lbl">완료</div><div class="val">${done}/${total}</div></div><div class="stat"><div class="lbl">현재 일차</div><div class="val">Day ${currentDayNumber()}</div></div><div class="stat"><div class="lbl">레벨</div><div class="val">${lv.short.split(" ")[1] || "Lv.1"}</div></div><div class="stat"><div class="lbl">뱃지</div><div class="val">${badges.length}/${BADGES.length}</div></div></div><div class="badge-row">${BADGES.map(b => `<span class="badge ${badges.includes(b)?"unlocked":""}">${badges.includes(b)?"✨ ":"🔒 "}${b.label}</span>`).join("")}</div>`;
  document.getElementById("levelPill").textContent = lv.short;
  return card;
}

function renderHome() {
  view.innerHTML = "";
  view.appendChild(renderTodayCard());
  view.appendChild(renderPaceStrip());
  view.appendChild(renderProgressCard());
  const title = document.createElement("h3");
  title.className = "section-title";
  title.textContent = "학습 분야 4가지";
  view.appendChild(title);
  const grid = document.createElement("div");
  grid.className = "grid";
  view.appendChild(grid);
  MODULES.forEach(m => {
    const done = m.lessons.filter(l => state.completed.has(l.id)).length;
    const ratio = done / m.lessons.length;
    const card = document.createElement("button");
    card.className = "module";
    card.innerHTML = `<div class="icon ${m.iconClass}">${m.icon}</div><h3>${m.title}</h3><div class="desc">${m.desc}</div><div class="mini-bar"><span style="width:${ratio*100}%"></span></div><div class="meta"><span>${done} / ${m.lessons.length} 레슨</span><span>${Math.round(ratio*100)}%</span></div>`;
    card.addEventListener("click", () => {
      state.tab = "learn";
      state.view = { type: "module", id: m.id };
      render();
    });
    grid.appendChild(card);
  });
  const sched = document.createElement("div");
  sched.className = "schedule";
  const total = totalDays();
  const today = currentDayNumber();
  let cells = "";
  for (let d = 1; d <= total; d++) {
    const ls = lessonsForDay(d);
    const allDone = ls.every(l => state.completed.has(l.id));
    let cls = "day-cell";
    if (allDone) cls += " done";
    else if (d === today) cls += " today";
    else if (d > today) cls += " future";
    cells += `<div class="${cls}" data-day="${d}" title="Day ${d}"><span class="num">${d}</span><span class="dot">${allDone ? "✓" : (d === today ? "★" : "")}</span></div>`;
  }
  sched.innerHTML = `<h3>📅 ${total}일 커리큘럼</h3><div class="day-grid">${cells}</div><div style="font-size:11px; color:#8a8278; margin-top:10px;"><span style="color:#1f8e5a; font-weight:700;">●</span> 완료 &nbsp;&nbsp;<span style="color:#ff8a5b; font-weight:700;">●</span> 오늘 &nbsp;&nbsp;<span style="color:#b8b1a6; font-weight:700;">●</span> 예정</div>`;
  sched.querySelectorAll("[data-day]").forEach(c => {
    c.addEventListener("click", () => {
      const d = parseInt(c.dataset.day);
      const ls = lessonsForDay(d);
      if (ls.length === 0) return;
      const next = ls.find(l => !state.completed.has(l.id)) || ls[0];
      state.tab = "learn";
      state.view = { type: "lesson", modId: next.modId, lessonId: next.id };
      render();
    });
  });
  view.appendChild(sched);
}

function renderLearnIndex() {
  view.innerHTML = "";
  MODULES.forEach(m => {
    const done = m.lessons.filter(l => state.completed.has(l.id)).length;
    const ratio = done / m.lessons.length;
    const card = document.createElement("div");
    card.className = "lesson-list";
    card.style.marginBottom = "12px";
    card.innerHTML = `<div class="lesson-list-header" style="cursor:pointer;"><div style="display:flex;align-items:center;gap:10px;"><div class="icon ${m.iconClass}" style="width:34px;height:34px;font-size:16px;">${m.icon}</div><div><h3>${m.title}</h3><div style="font-size:12px;color:#8a8278;margin-top:2px;">${done}/${m.lessons.length} 레슨 · ${Math.round(ratio*100)}%</div></div></div><span class="back">›</span></div>`;
    card.querySelector(".lesson-list-header").addEventListener("click", () => {
      state.view = { type: "module", id: m.id };
      render();
    });
    view.appendChild(card);
  });
}

function renderModule(modId) {
  const m = MODULES.find(x => x.id === modId);
  const today = currentDayNumber();
  view.innerHTML = `<div class="lesson-list"><div class="lesson-list-header"><h3>${m.icon} ${m.title}</h3><button class="back" id="backBtn">‹ 뒤로</button></div><div id="lessonList"></div></div>`;
  document.getElementById("backBtn").addEventListener("click", () => {
    state.view = { type: "learn" };
    render();
  });
  const list = document.getElementById("lessonList");
  m.lessons.forEach((l, i) => {
    const done = state.completed.has(l.id);
    const dayNum = lessonDayNumber(l.id);
    let dayCls = "";
    let dayLbl = `Day ${dayNum}`;
    if (dayNum === today) { dayCls = "today"; dayLbl = `🌅 오늘`; }
    else if (dayNum < today) dayCls = "past";
    else dayCls = "future";
    const el = document.createElement("div");
    el.className = "lesson " + dayCls + (done ? " done" : "");
    el.innerHTML = `<div class="num">${done ? "✓" : i + 1}</div><div class="title">${l.title}</div><span class="day-tag">${dayLbl}</span><div class="arrow">›</div>`;
    el.addEventListener("click", () => {
      state.view = { type: "lesson", modId: m.id, lessonId: l.id };
      render();
    });
    list.appendChild(el);
  });
}

function renderLesson(modId, lessonId) {
  const m = MODULES.find(x => x.id === modId);
  const lIdx = m.lessons.findIndex(x => x.id === lessonId);
  const l = m.lessons[lIdx];
  const done = state.completed.has(l.id);
  const dayNum = lessonDayNumber(l.id);
  const today = currentDayNumber();
  let dayBadge = "";
  if (dayNum === today) dayBadge = `<span style="background:#ff8a5b;color:#fff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px;">🌅 오늘 분량</span>`;
  else if (dayNum < today) dayBadge = `<span style="background:#e3edf8;color:#305892;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px;">Day ${dayNum} · 지난 학습</span>`;
  else dayBadge = `<span style="background:#ece6f6;color:#5b48a0;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;margin-left:6px;">Day ${dayNum} · 예정</span>`;
  view.innerHTML = `<div class="lesson-detail"><div class="crumb">${m.title} · 레슨 ${lIdx + 1} / ${m.lessons.length} ${dayBadge}</div><h2>${l.title}</h2><div class="lead">${l.lead}</div><div class="body">${l.body}</div>${l.quiz ? `<div class="quiz"><div class="q">📝 퀴즈 · ${l.quiz.q}</div><div class="opts" id="opts"></div><div class="explain hidden" id="explain"></div></div>` : ""}<div class="check-row"><button class="btn ghost" id="prevBtn">‹ 목록</button>${lIdx > 0 ? `<button class="btn ghost" id="prevLessonBtn">이전</button>` : ""}<div style="flex:1;"></div><button class="btn ${done ? "success" : ""}" id="completeBtn">${done ? "✓ 완료됨" : "완료 표시"}</button>${lIdx < m.lessons.length - 1 ? `<button class="btn" id="nextLessonBtn">다음 ›</button>` : ""}</div></div>`;
  document.getElementById("prevBtn").addEventListener("click", () => {
    state.view = { type: "module", id: modId };
    render();
  });
  document.getElementById("completeBtn").addEventListener("click", () => {
    if (state.completed.has(l.id)) state.completed.delete(l.id);
    else state.completed.add(l.id);
    saveState();
    render();
  });
  if (lIdx < m.lessons.length - 1) {
    document.getElementById("nextLessonBtn").addEventListener("click", () => {
      state.completed.add(l.id);
      saveState();
      state.view = { type: "lesson", modId, lessonId: m.lessons[lIdx + 1].id };
      render();
    });
  }
  if (lIdx > 0) {
    document.getElementById("prevLessonBtn").addEventListener("click", () => {
      state.view = { type: "lesson", modId, lessonId: m.lessons[lIdx - 1].id };
      render();
    });
  }
  if (l.quiz) {
    const opts = document.getElementById("opts");
    l.quiz.opts.forEach((o, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.textContent = `${String.fromCharCode(65+i)}. ${o}`;
      b.addEventListener("click", () => {
        opts.querySelectorAll("button").forEach(x => x.disabled = true);
        if (i === l.quiz.answer) b.classList.add("correct");
        else { b.classList.add("wrong"); opts.children[l.quiz.answer].classList.add("correct"); }
        const ex = document.getElementById("explain");
        ex.textContent = "💡 " + l.quiz.explain;
        ex.classList.remove("hidden");
      });
      opts.appendChild(b);
    });
  }
}

function renderTools() {
  view.innerHTML = `<div class="tool-card"><h3>📈 복리 계산기</h3><div class="tdesc">매달 적립 + 연 수익률로 굴렸을 때 N년 후 자산은?</div><div class="field"><label>월 적립 금액 (만원)</label><input type="number" id="dca_monthly" value="50" /></div><div class="field"><label>연 기대 수익률 (%)</label><input type="number" id="dca_rate" value="7" step="0.1" /><span class="hint">수익률은 가정일 뿐 — S&P 500 장기 평균이 약 9~10%지만 매년 등락 큼</span></div><div class="field"><label>투자 기간 (년)</label><input type="number" id="dca_years" value="20" /></div><button class="btn" id="dcaBtn">계산하기</button><div class="result hidden" id="dcaResult"></div></div><div class="tool-card"><h3>⏱️ 72의 법칙 — 자산이 2배 되는 시간</h3><div class="tdesc">연 수익률만 알면, 원금이 두 배 되는 데 몇 년 걸릴지 빠르게 계산 (수익률 6~10%일 때 가장 정확).</div><div class="field"><label>연 수익률 (%)</label><input type="number" id="r72" value="6" step="0.1" /></div><button class="btn" id="r72Btn">계산하기</button><div class="result hidden" id="r72Result"></div></div><div class="tool-card"><h3>🏦 주담대 월 상환액 계산기</h3><div class="tdesc">원리금균등 상환 기준으로 매달 갚을 금액과 총이자를 계산.</div><div class="field"><label>대출 원금 (만원)</label><input type="number" id="loan_amt" value="30000" /></div><div class="field"><label>연 금리 (%)</label><input type="number" id="loan_rate" value="4" step="0.01" /></div><div class="field"><label>대출 기간 (년)</label><input type="number" id="loan_years" value="30" /></div><button class="btn" id="loanBtn">계산하기</button><div class="result hidden" id="loanResult"></div></div><div class="tool-card"><h3>💼 비상금 목표 계산기</h3><div class="tdesc">월 생활비 기준으로 권장 비상금 규모를 알려드려요.</div><div class="field"><label>월 생활비 (만원)</label><input type="number" id="ef_monthly" value="200" /></div><button class="btn" id="efBtn">계산하기</button><div class="result hidden" id="efResult"></div></div>`;
  document.getElementById("dcaBtn").addEventListener("click", () => {
    const m = +document.getElementById("dca_monthly").value;
    const r = +document.getElementById("dca_rate").value / 100;
    const y = +document.getElementById("dca_years").value;
    const months = y * 12;
    const rm = r / 12;
    const fv = rm === 0 ? m * months : m * ((Math.pow(1 + rm, months) - 1) / rm) * (1 + rm);
    const principal = m * months;
    const profit = fv - principal;
    const el = document.getElementById("dcaResult");
    el.classList.remove("hidden");
    el.innerHTML = `<div class="big">${formatMoney(fv)}만원</div><div class="small">원금 ${formatMoney(principal)}만원 + 수익 ${formatMoney(profit)}만원<br>${y}년 동안 매달 ${m}만원씩 연 ${(r*100).toFixed(1)}% 수익률 가정 (월복리)</div>`;
  });
  document.getElementById("r72Btn").addEventListener("click", () => {
    const r = +document.getElementById("r72").value;
    if (r <= 0) return;
    const years = 72 / r;
    const el = document.getElementById("r72Result");
    el.classList.remove("hidden");
    el.innerHTML = `<div class="big">약 ${years.toFixed(1)}년</div><div class="small">연 ${r}% 수익률이면 원금이 2배 되는 데 약 ${years.toFixed(1)}년 걸려요.<br>예: 1,000만원 → ${(years).toFixed(1)}년 후 2,000만원 (수익률 6~10% 구간에서 가장 정확)</div>`;
  });
  document.getElementById("loanBtn").addEventListener("click", () => {
    const p = +document.getElementById("loan_amt").value;
    const r = +document.getElementById("loan_rate").value / 100 / 12;
    const n = +document.getElementById("loan_years").value * 12;
    const pmt = r === 0 ? p / n : p * r * Math.pow(1+r, n) / (Math.pow(1+r, n) - 1);
    const total = pmt * n;
    const interest = total - p;
    const el = document.getElementById("loanResult");
    el.classList.remove("hidden");
    el.innerHTML = `<div class="big">월 ${formatMoney(pmt)}만원</div><div class="small">총 상환액: ${formatMoney(total)}만원 (원금 ${formatMoney(p)} + 이자 ${formatMoney(interest)}만원)</div>`;
  });
  document.getElementById("efBtn").addEventListener("click", () => {
    const m = +document.getElementById("ef_monthly").value;
    const el = document.getElementById("efResult");
    el.classList.remove("hidden");
    el.innerHTML = `<div class="big">${formatMoney(m * 3)} ~ ${formatMoney(m * 6)}만원</div><div class="small">최소 3개월(${formatMoney(m*3)}만원) ~ 권장 6개월(${formatMoney(m*6)}만원).<br>파킹통장·CMA에 보관해 즉시 인출 가능하게 두세요.</div>`;
  });
}

function formatMoney(n) { return Math.round(n).toLocaleString("ko-KR"); }

function renderGlossary() {
  view.innerHTML = `<input class="search" id="termSearch" placeholder="🔍 용어 검색 (예: 복리, ETF, DSR)" /><div id="termList"></div>`;
  const list = document.getElementById("termList");
  function paint(filter = "") {
    list.innerHTML = "";
    const f = filter.trim().toLowerCase();
    const filtered = GLOSSARY.filter(t => !f || t.name.toLowerCase().includes(f) || t.ko.toLowerCase().includes(f) || t.def.toLowerCase().includes(f));
    if (filtered.length === 0) { list.innerHTML = '<div class="empty">검색 결과가 없어요</div>'; return; }
    filtered.sort((a,b) => a.name.localeCompare(b.name, "ko"));
    filtered.forEach(t => {
      const el = document.createElement("div");
      el.className = "term";
      el.innerHTML = `<div class="name">${t.name}<span class="ko">${t.ko}</span></div><div class="def">${t.def}</div>`;
      list.appendChild(el);
    });
  }
  paint();
  document.getElementById("termSearch").addEventListener("input", e => paint(e.target.value));
}

function render() {
  Array.from(tabs.children).forEach(b => b.classList.toggle("active", b.dataset.tab === state.tab));
  if (state.view.type === "home") renderHome();
  else if (state.view.type === "learn") renderLearnIndex();
  else if (state.view.type === "module") renderModule(state.view.id);
  else if (state.view.type === "lesson") renderLesson(state.view.modId, state.view.lessonId);
  else if (state.view.type === "tools") renderTools();
  else if (state.view.type === "glossary") renderGlossary();
  window.scrollTo({top: 0, behavior: "smooth"});
}

render();
</script>
</body>
</html>
